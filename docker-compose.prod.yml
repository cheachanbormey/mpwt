services:
  # ==========================================
  # Laravel PHP-FPM Application Service
  # ==========================================
  app:
    build:
      context: .
      target: app
    container_name: hrms_app
    restart: always
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "true"
      DB_HOST: db
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - storage_uploads:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hrms_network
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================
  # Nginx Reverse Proxy / Web Server
  # ==========================================
  web:
    build:
      context: .
      target: web
    container_name: hrms_web
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - storage_uploads:/var/www/html/public/storage:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - hrms_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/robots.txt || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================
  # MySQL Database Service
  # ==========================================
  db:
    image: mysql:8.0
    container_name: hrms_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hrms}
      MYSQL_USER: ${DB_USERNAME:-hrms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hrms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis Cache & Session Store
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: hrms_redis
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-redis_secret}"
    volumes:
      - redis_data:/data
    networks:
      - hrms_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Laravel Queue Worker
  # ==========================================
  queue:
    build:
      context: .
      target: app
    container_name: hrms_queue
    restart: always
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "false"
      DB_HOST: db
      REDIS_HOST: redis
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - storage_uploads:/var/www/html/storage/app/public
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hrms_network

  # ==========================================
  # Laravel Scheduled Task Runner (Cron)
  # ==========================================
  scheduler:
    build:
      context: .
      target: app
    container_name: hrms_scheduler
    restart: always
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "false"
      DB_HOST: db
      REDIS_HOST: redis
    command: php artisan schedule:work
    volumes:
      - storage_uploads:/var/www/html/storage/app/public
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - hrms_network

# ==========================================
# Persistent Volumes & Networks
# ==========================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  storage_uploads:
    driver: local

networks:
  hrms_network:
    driver: bridge
