services:
  mysql:
    image: mysql:8.0
    container_name: hrms_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hrms}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional database GUI manager (uncomment if you want phpMyAdmin on http://localhost:8080)
  # phpmyadmin:
  #   image: phpmyadmin/phpmyadmin:latest
  #   container_name: hrms_phpmyadmin
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"
  #   environment:
  #     PMA_HOST: mysql
  #     PMA_PORT: 3306
  #   depends_on:
  #     mysql:
  #       condition: service_healthy

volumes:
  mysql_data:
    driver: local
